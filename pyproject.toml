[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "namedaemon"
dynamic = ["version"]
description = "Client and CLI for NameDaemon: .com domain availability, brandability scores, name ideas, TLD costs and domain health."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Krasen Slavov" }]
keywords = ["domain", "domain-name", "domain-availability", "whois", "rdap", "dns", "tld", "brand-name", "name-generator", "namedaemon"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet :: Name Service (DNS)",
  "Typing :: Typed",
]
dependencies = []

[project.scripts]
namedaemon = "namedaemon.cli:main"

[project.urls]
Homepage = "https://namedaemon.com"
Repository = "https://github.com/krasenslavov/namedaemon-py"
Issues = "https://github.com/krasenslavov/namedaemon-py/issues"
Changelog = "https://github.com/krasenslavov/namedaemon-py/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/namedaemon/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/namedaemon"]
